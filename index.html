<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | NFT preview card component</title>
  </head>

  <body>
    <main>
      <article>
        <a href="#">
          <div class="image-container">
            <img class="image-equilibrium" src="./images/image-equilibrium.jpg" alt="Equilibrium NFT" />
            <img class="icon-view" src="./images/icon-view.svg" alt="" />
          </div>
        </a>
        <h1><a href="#">Equilibrium #3429</a></h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="details">
          <div class="currency">
            <img src="./images/icon-ethereum.svg" alt="" /> 0.041 ETH
          </div>
          <div class="days">
            <img src="images/icon-clock.svg" alt="" />3 days left
          </div>
        </div>
        <hr />
        <div class="creator">
          <img src="./images/image-avatar.png" alt="" />
          <p>Creation of <a href="#">Jules Wyvern</a></p>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io/profile/alexandre-delsol"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://github.com/alexandre-delsol">Alexandre DELSOL</a>.
    </footer>
  </body>
</html>
